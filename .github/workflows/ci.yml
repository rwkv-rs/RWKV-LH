name: rwkv-lh-source-build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  source-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13
      - name: Check public source boundary
        run: |
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          private = ('data/', 'tests/', 'benchmarks/', 'acceptance_tests/', 'temp/', 'outputs/')
          forbidden = [path for path in paths if path.startswith(private)]
          if forbidden:
              raise SystemExit('Local-only files were committed: ' + ', '.join(forbidden))
          PY
      - run: uv sync --frozen --no-dev
      - name: Compile project sources
        run: .venv/bin/python -m compileall -q rwkv_lh scripts
      - name: Check installed command entrypoints without model requests
        run: |
          .venv/bin/python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path
          entries = tomllib.loads(Path('pyproject.toml').read_text())['project']['scripts']
          for command in entries:
              subprocess.run([str(Path(sys.executable).parent / command), '--help'],
                             check=True, timeout=30)
          PY
      - run: uv build
