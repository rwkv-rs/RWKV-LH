name: architecture-regression

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --dev
      - run: uv run pytest -q
      - run: uv run rwkv-lh-control --output /tmp/lh-control-30
