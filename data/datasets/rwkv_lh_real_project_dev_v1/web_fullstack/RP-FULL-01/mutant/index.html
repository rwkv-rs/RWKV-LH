<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Desk</title><style>body{font:16px system-ui;margin:0;background:#eef2f6;color:#183047}main{max-width:980px;margin:auto;padding:30px}h1{margin-bottom:8px}form,.filters,article{background:white;padding:18px;margin:14px 0;border:1px solid #cbd5df;border-radius:12px}label{display:inline-flex;flex-direction:column;gap:5px;margin:5px 14px 5px 0}input,textarea,select,button{font:inherit;padding:9px;border:1px solid #8ca1b4;border-radius:6px}button{background:#194b69;color:white;cursor:pointer;margin:5px}button:disabled{opacity:.5}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e79d2b;outline-offset:2px}.filters{display:flex;flex-wrap:wrap;align-items:center}article h2{font-size:20px}article label{display:inline-flex}#notice{min-height:24px;color:#94330a}small{color:#496170}</style><main><h1>Support Desk</h1><p>Create, assign and resolve your team's support requests.</p><form id="editor"><label>Ticket title<input id="title"></label><label>Ticket description<textarea id="description"></textarea></label><button>Create ticket</button></form><div id="notice" role="alert"></div><div class="filters"><label>Search tickets<input id="search"></label><label>Status filter<select id="status"><option>all</option><option>open</option><option>closed</option></select></label></div><section id="tickets" aria-label="Tickets"></section></main><script>const $=id=>document.getElementById(id);const el=(tag,text)=>{let n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};function button(text,fn){let n=el('button',text);n.type='button';n.onclick=fn;return n}function notice(t){$('notice').textContent=t}
async function api(url,method='GET',body){let r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v}
async function render(){try{let v=await api('/api/tickets?q='+encodeURIComponent($('search').value)+'&status='+$('status').value),out=$('tickets');out.replaceChildren();for(let t of v.tickets){let a=el('article');a.setAttribute('aria-label','Ticket '+t.title);a.append(el('h2',t.title),el('p',t.description),el('p','Status: '+t.status));let label=el('label','Assignee'),input=el('input');input.value=t.assignee;input.setAttribute('aria-label','Assignee');label.append(input);a.append(label,button('Assign',async()=>{try{await api('/api/tickets/'+t.id,'PATCH',{assignee:input.value.trim()});await render()}catch(e){notice(e.message)}}));if(t.status==='open')a.append(button('Close',async()=>{await api('/api/tickets/'+t.id,'PATCH',{status:'closed'});await render()}));out.append(a)}}catch(e){notice(e.message)}}
$('editor').onsubmit=async e=>{e.preventDefault();try{await api('/api/tickets','POST',{title:$('title').value,description:$('description').value});$('editor').reset();notice('');await render()}catch(e){notice(e.message)}};for(let id of ['search','status'])$(id).oninput=render;render();
</script></html>
