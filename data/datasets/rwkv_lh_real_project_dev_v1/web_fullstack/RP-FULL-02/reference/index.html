<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Proposals</title><style>body{font:16px system-ui;margin:0;background:#eef2f6;color:#183047}main{max-width:980px;margin:auto;padding:30px}h1{margin-bottom:8px}form,.filters,article{background:white;padding:18px;margin:14px 0;border:1px solid #cbd5df;border-radius:12px}label{display:inline-flex;flex-direction:column;gap:5px;margin:5px 14px 5px 0}input,textarea,select,button{font:inherit;padding:9px;border:1px solid #8ca1b4;border-radius:6px}button{background:#194b69;color:white;cursor:pointer;margin:5px}button:disabled{opacity:.5}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e79d2b;outline-offset:2px}.filters{display:flex;flex-wrap:wrap;align-items:center}article h2{font-size:20px}article label{display:inline-flex}#notice{min-height:24px;color:#94330a}small{color:#496170}</style><main><h1>Team Proposals</h1><p>Share an idea, vote once per teammate and close the decision.</p><label>Your name<input id="voter" value="Alice"></label><form id="editor"><label>Proposal title<input id="title"></label><label>Proposal description<textarea id="description"></textarea></label><button>Create proposal</button></form><div id="notice" role="alert"></div><div class="filters"><label>Sort proposals<select id="sort"><option>newest</option><option>votes</option></select></label></div><section id="proposals" aria-label="Proposals"></section></main><script>const $=id=>document.getElementById(id);const el=(tag,text)=>{let n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};function button(text,fn){let n=el('button',text);n.type='button';n.onclick=fn;return n}function notice(t){$('notice').textContent=t}
async function api(url,method='GET',body){let r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v}
async function render(){try{let v=await api('/api/proposals?voter='+encodeURIComponent($('voter').value.trim())+'&sort='+$('sort').value),out=$('proposals');out.replaceChildren();for(let p of v.proposals){let a=el('article');a.setAttribute('aria-label','Proposal '+p.title);a.append(el('h2',p.title),el('p',p.description),el('p','Votes: '+p.votes),el('p',p.closed?'Voting closed':'Voting open'));let vote=button(p.voted?'Remove vote':'Vote',async()=>{try{await api('/api/proposals/'+p.id+'/vote','PUT',{voter:$('voter').value.trim(),active:!p.voted});await render()}catch(e){notice(e.message)}});vote.disabled=p.closed;a.append(vote);if(!p.closed)a.append(button('Close voting',async()=>{await api('/api/proposals/'+p.id,'PATCH',{closed:true});await render()}));out.append(a)}}catch(e){notice(e.message)}}
$('editor').onsubmit=async e=>{e.preventDefault();try{await api('/api/proposals','POST',{title:$('title').value,description:$('description').value});$('editor').reset();notice('');await render()}catch(e){notice(e.message)}};$('voter').onchange=render;$('sort').onchange=render;render();
</script></html>
