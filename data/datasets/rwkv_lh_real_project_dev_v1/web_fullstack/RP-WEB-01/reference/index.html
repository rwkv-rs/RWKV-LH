<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Kanban</title><style>body{font:16px system-ui;margin:0;background:#eef2f6;color:#183047}main{max-width:980px;margin:auto;padding:30px}h1{margin-bottom:8px}form,.filters,article{background:white;padding:18px;margin:14px 0;border:1px solid #cbd5df;border-radius:12px}label{display:inline-flex;flex-direction:column;gap:5px;margin:5px 14px 5px 0}input,textarea,select,button{font:inherit;padding:9px;border:1px solid #8ca1b4;border-radius:6px}button{background:#194b69;color:white;cursor:pointer;margin:5px}button:disabled{opacity:.5}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e79d2b;outline-offset:2px}.filters{display:flex;flex-wrap:wrap;align-items:center}article h2{font-size:20px}article label{display:inline-flex}#notice{min-height:24px;color:#94330a}small{color:#496170}</style><main><h1>Team Kanban</h1><p>Plan work and move it forward. Changes are saved in this browser.</p><form id="editor"><label>Task title<input id="title" aria-label="Task title"></label><label>Description<textarea id="description" aria-label="Description"></textarea></label><label>Priority<select id="priority" aria-label="Priority"><option>low</option><option selected>medium</option><option>high</option></select></label><button id="submit">Add task</button><button id="cancel" type="button" hidden>Cancel edit</button></form><div id="notice" role="alert"></div><div class="filters"><label>Search tasks<input id="search"></label><label>Status filter<select id="status"><option>all</option><option>todo</option><option>doing</option><option>done</option></select></label><label>Priority filter<select id="priorityFilter"><option>all</option><option>low</option><option>medium</option><option>high</option></select></label></div><section id="tasks" aria-label="Tasks"></section></main><script>const $=id=>document.getElementById(id);const el=(tag,text)=>{let n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};function button(text,fn){let n=el('button',text);n.type='button';n.onclick=fn;return n}function notice(t){$('notice').textContent=t}
let tasks=JSON.parse(localStorage.getItem('kanban.tasks')||'[]'),editing=null;
function save(){localStorage.setItem('kanban.tasks',JSON.stringify(tasks));render()}
function reset(){editing=null;$('editor').reset();$('priority').value='medium';$('submit').textContent='Add task';$('cancel').hidden=true}
function render(){let out=$('tasks');out.replaceChildren();let filtered=tasks.filter(t=>(!$('search').value||[t.title,t.description].join(' ').toLowerCase().includes($('search').value.toLowerCase()))&&($('status').value==='all'||t.status===$('status').value)&&($('priorityFilter').value==='all'||t.priority===$('priorityFilter').value));for(let t of filtered){let a=el('article');a.setAttribute('aria-label','Task '+t.title);a.append(el('h2',t.title),el('p',t.description),el('p','Status: '+t.status+' · Priority: '+t.priority));a.append(button('Edit',()=>{editing=t.id;$('title').value=t.title;$('description').value=t.description;$('priority').value=t.priority;$('submit').textContent='Save task';$('cancel').hidden=false;$('title').focus()}));for(let state of ['todo','doing','done'])if(state!==t.status)a.append(button('Move to '+state,()=>{t.status=state;save()}));a.append(button('Delete',()=>{tasks=tasks.filter(x=>x.id!==t.id);if(editing===t.id)reset();save()}));out.append(a)}if(!filtered.length)out.append(el('p','No matching tasks'))}
$('editor').onsubmit=e=>{e.preventDefault();let title=$('title').value.trim();if(!title){notice('Task title is required');return}let value={title,description:$('description').value.trim(),priority:$('priority').value};if(editing)Object.assign(tasks.find(t=>t.id===editing),value);else tasks.push({id:crypto.randomUUID(),status:'todo',...value});notice('');reset();save()};$('cancel').onclick=reset;for(let id of ['search','status','priorityFilter'])$(id).oninput=render;render();
</script></html>
