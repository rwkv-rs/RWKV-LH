<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading List</title><style>body{font:16px system-ui;margin:0;background:#eef2f6;color:#183047}main{max-width:980px;margin:auto;padding:30px}h1{margin-bottom:8px}form,.filters,article{background:white;padding:18px;margin:14px 0;border:1px solid #cbd5df;border-radius:12px}label{display:inline-flex;flex-direction:column;gap:5px;margin:5px 14px 5px 0}input,textarea,select,button{font:inherit;padding:9px;border:1px solid #8ca1b4;border-radius:6px}button{background:#194b69;color:white;cursor:pointer;margin:5px}button:disabled{opacity:.5}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e79d2b;outline-offset:2px}.filters{display:flex;flex-wrap:wrap;align-items:center}article h2{font-size:20px}article label{display:inline-flex}#notice{min-height:24px;color:#94330a}small{color:#496170}</style><main><h1>Reading List</h1><p>Your reading library, saved locally with portable JSON backups.</p><form id="editor"><label>Book title<input id="title"></label><label>Author<input id="author"></label><label>Tags<input id="tags" placeholder="history, systems"></label><button>Add book</button></form><div id="notice" role="alert"></div><div class="filters"><label>Search books<input id="search"></label><fieldset id="tagFilters"><legend>Filter by tags (all selected tags)</legend></fieldset><button id="export" type="button">Export JSON</button><label>Import JSON<input id="importFile" type="file" accept="application/json"></label><button id="import" type="button">Import books</button></div><section id="books" aria-label="Books"></section></main><script>const $=id=>document.getElementById(id);const el=(tag,text)=>{let n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};function button(text,fn){let n=el('button',text);n.type='button';n.onclick=fn;return n}function notice(t){$('notice').textContent=t}
let books=JSON.parse(localStorage.getItem('reading.books')||'[]'),selected=new Set();const norm=ts=>[...new Set(ts.map(t=>t.trim().toLowerCase()).filter(Boolean))];
function save(){localStorage.setItem('reading.books',JSON.stringify(books));render()}
function render(){let box=$('tagFilters');box.replaceChildren(el('legend','Filter by tags (all selected tags)'));for(let tag of [...new Set(books.flatMap(b=>b.tags))].sort()){let label=el('label'),input=el('input');input.type='checkbox';input.setAttribute('aria-label','Tag: '+tag);input.checked=selected.has(tag);input.onchange=()=>{input.checked?selected.add(tag):selected.delete(tag);render()};label.append(input,document.createTextNode(tag));box.append(label)}let out=$('books');out.replaceChildren();for(let b of books.filter(b=>[...selected].every(t=>b.tags.includes(t))&&[b.title,b.author].join(' ').toLowerCase().includes($('search').value.toLowerCase()))){let a=el('article');a.setAttribute('aria-label','Book '+b.title);a.append(el('h2',b.title),el('p',b.author),el('p',b.tags.join(', ')),button('Delete',()=>{books=books.filter(x=>x.id!==b.id);save()}));out.append(a)}}
$('editor').onsubmit=e=>{e.preventDefault();let title=$('title').value.trim(),author=$('author').value.trim();if(!title||!author){notice('Book title and author are required');return}books.push({id:crypto.randomUUID(),title,author,tags:norm($('tags').value.split(','))});$('editor').reset();notice('');save()};$('search').oninput=render;
$('export').onclick=()=>{let url=URL.createObjectURL(new Blob([JSON.stringify({version:1,books},null,2)],{type:'application/json'}));let a=el('a');a.href=url;a.download='reading-list.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};
$('import').onclick=async()=>{try{let file=$('importFile').files[0];if(!file)throw Error('Choose a JSON file');let v=JSON.parse(await file.text()),ids=new Set();if(v.version!==1||!Array.isArray(v.books))throw Error('Invalid library');books=[];save();let next=v.books.map(b=>{if(typeof b.id!=='string'||!b.id.trim()||ids.has(b.id)||typeof b.title!=='string'||!b.title.trim()||typeof b.author!=='string'||!b.author.trim()||!Array.isArray(b.tags)||b.tags.some(t=>typeof t!=='string'))throw Error('Invalid book');ids.add(b.id);return{id:b.id,title:b.title.trim(),author:b.author.trim(),tags:norm(b.tags)}});books=next;selected.clear();notice('Imported '+books.length+' books');save()}catch(e){notice('Import rejected: '+e.message)}};render();
</script></html>
