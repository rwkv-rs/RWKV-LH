[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkv-lh"
version = "0.1.0"
description = "Persistent, verifiable Long-Horizon Agent runtime for RWKV"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[project.scripts]
rwkv-lh = "scripts.run_long_horizon:main"
rwkv-lh-control = "scripts.run_lh_control_benchmark:main"
rwkv-lh-e2e = "scripts.run_rwkv_e2e_benchmark:main"
rwkv-lh-runtime-smoke = "scripts.runtime_smoke:main"
rwkv-lh-web = "scripts.run_web_ui:main"

[tool.setuptools.packages.find]
include = ["rwkv_lh*", "scripts*", "benchmarks*"]

[tool.setuptools.package-data]
rwkv_lh = ["data/*.txt", "web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]
"benchmarks.architecture_regression.lh_control_30" = ["tasks.json"]
"benchmarks.rwkv_e2e.rwkv_e2e_30" = ["tasks.json", "acceptance.json"]
"benchmarks.rwkv_e2e.rwkv_e2e_lh12" = ["tasks.json", "acceptance.json"]
"benchmarks.rwkv_e2e.rwkv_e2e_extension48" = ["tasks.json", "acceptance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
