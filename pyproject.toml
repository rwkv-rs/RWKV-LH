[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkv-lh"
version = "0.1.0"
description = "Persistent, verifiable Long-Horizon Agent runtime for RWKV"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "requests>=2.32,<3",
]

[project.optional-dependencies]
selector-runtime = [
  "numpy>=2,<3",
  "torch==2.8.0",
]
benchmark-web = [
  "playwright==1.61.0",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[project.scripts]
rwkv-lh = "scripts.run_rwkv_agent:main"
rwkv-lh-coding = "scripts.run_rwkv_coding_agent:main"
rwkv-lh-data = "scripts.run_trace_correction_pipeline:main"
rwkv-lh-runtime-smoke = "scripts.runtime_smoke:main"
rwkv-lh-stack = "scripts.manage_runtime_stack:main"
rwkv-lh-web = "scripts.run_web_ui:main"

[tool.setuptools.packages.find]
include = ["rwkv_lh*", "scripts*"]

[tool.setuptools.package-data]
rwkv_lh = [
  "data/*.txt",
  "inference/*.json",
  "goal_web_assets/*.html",
  "goal_web_assets/*.css",
  "goal_web_assets/*.js",
  "goal_web_assets/*.json",
  "statetune_native_csrc/LICENSE",
  "statetune_native_csrc/ORIGIN.json",
  "statetune_native_csrc/*.cpp",
  "statetune_native_csrc/*.h",
  "statetune_native_csrc/common/wkv7/*.cpp",
  "statetune_native_csrc/common/wkv7/*.h",
  "statetune_native_csrc/common/wkv7/*.cu",
  "statetune_native_csrc/common/wkv7/*.cuh",
  "statetune_native_csrc/validation/*.cu",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=data/test_runs/pytest"
