[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkv-lh"
version = "0.1.0"
description = "Persistent, verifiable Long-Horizon Agent runtime for RWKV"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "requests>=2.32,<3",
]

[project.optional-dependencies]
selector-runtime = [
  "numpy>=2,<3",
  "torch==2.8.0",
]
benchmark-web = [
  "playwright==1.61.0",
]

[dependency-groups]
dev = [
    "llguidance>=1.7.0,<1.8.0",
    "pytest>=9,<10",
    "transformers==4.57.1",
]

[project.scripts]
rwkv-lh = "scripts.run_rwkv_agent:main"
rwkv-lh-coding = "scripts.run_rwkv_coding_agent:main"
rwkv-lh-data = "scripts.run_trace_correction_pipeline:main"
rwkv-lh-runtime-smoke = "scripts.runtime_smoke:main"
rwkv-lh-stack = "scripts.manage_runtime_stack:main"
rwkv-lh-web = "scripts.run_web_ui:main"
rwkv-lh-train = "rwkv_lh.skyrl_training:main"
rwkv-lh-serve = "rwkv_lh.inference.serve_irwkv:main"
rwkv-lh-artifact = "scripts.prepare_rwkv_irwkv_artifact:main"
rwkv-lh-seal-export = "scripts.seal_skyrl_export:main"

[project.entry-points."irwkv.general_plugins"]
rwkv_lh_ccview_decoder = "rwkv_lh.cc_view_service:install_decoder_backend"
rwkv_lh_state_worker = "rwkv_lh.inference.irwkv_plugin:register_worker"

[project.entry-points."irwkv.endpoint_plugins"]
rwkv_lh_native = "rwkv_lh.inference.irwkv_plugin:endpoint"
rwkv_lh_ccview = "rwkv_lh.cc_view_service:endpoint_plugin"

[tool.setuptools.packages.find]
include = ["rwkv_lh*", "scripts*"]

[tool.setuptools.package-data]
rwkv_lh = [
  "data/*.txt",
  "inference/*.json",
  "skyrl.lock.json",
  "goal_web_assets/*.html",
  "goal_web_assets/*.css",
  "goal_web_assets/*.js",
  "goal_web_assets/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=data/test_runs/pytest"
